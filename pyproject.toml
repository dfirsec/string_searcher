[project]
name = "string-searcher"
version = "0.2.0"
description = "Search all files in a directory for a given search term."
authors = [{ name = "Mitch Haddadi", email = "12067255+dfirsec@users.noreply.github.com" }]
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dependencies = ["rich>=13.7.1,<14"]

[project.scripts]
string-searcher = "string_searcher.cli:entrypoint"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/string_searcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
